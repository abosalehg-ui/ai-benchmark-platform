name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check backend/ tests/

      - name: Run tests with coverage gate
        run: pytest tests/ -v --cov=backend --cov-report=term-missing --cov-fail-under=80

  # مسار Docker هو الـ backend الموصى به للنشر وصار الافتراضي عبر "auto"،
  # لكن اختباره الحقيقي كان خلف RUN_DOCKER_TESTS=1 فلم يعمل في CI إطلاقاً —
  # فمرّ عطل صلاحيات (المجلّد 0700 بينما الحاوية تعمل بمستخدم nobody) بصمت.
  # runners الـ GitHub فيها Docker، فلا عذر لتخطّيه.
  sandbox-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Sandbox tests against a real Docker daemon
        env:
          RUN_DOCKER_TESTS: "1"
          SANDBOX_BACKEND: docker
        run: pytest tests/test_sandbox.py -v

  # 2,684 سطر واجهة (JS + CSS) كانت بلا فاحص ولا اختبار — وهو بالضبط سبب
  # نجاة الدوال والـ CSS الميتة بينما ruff يفحص backend/ بالكامل
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # مُشغّل اختبارات Node المدمج — بلا اعتماديات ولا خطوة بناء
      - name: Frontend unit tests
        run: node --test tests/*.test.js

      - name: Lint JS (eslint)
        run: npx --yes eslint@9 --config eslint.config.mjs js tests

      - name: Lint CSS (stylelint)
        run: npx --yes stylelint@16 --config .stylelintrc.json styles.css vendor/fonts.css

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install audit tooling
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      # فحص ثغرات الاعتماديات — لم يكن موجوداً إطلاقاً
      - name: Audit dependencies
        run: pip-audit -r requirements.txt --strict
